services:
  byod_license:
    build:
      context: .
      dockerfile: Dockerfile
    image: byod_license:prod
    container_name: byod_license
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      NEXT_TELEMETRY_DISABLED: "1"
      MONGO_URI: "op://BYOD/BYOD_LICENSE/MONGO_URI"
      GMAIL_OAUTH_CLIENT_ID: "op://BYOD/BYOD_LICENSE/GMAIL_OAUTH_CLIENT_ID"
      GMAIL_OAUTH_CLIENT_SECRET: "op://BYOD/BYOD_LICENSE/GMAIL_OAUTH_CLIENT_SECRET"
      GMAIL_OAUTH_REDIRECT_URI: "op://BYOD/BYOD_LICENSE/GMAIL_OAUTH_REDIRECT_URI"
      GMAIL_OAUTH_REFRESH_TOKEN: "op://BYOD/BYOD_LICENSE/GMAIL_OAUTH_REFRESH_TOKEN"
      GMAIL_OAUTH_ACCESS_TOKEN: "op://BYOD/BYOD_LICENSE/GMAIL_OAUTH_ACCESS_TOKEN"
      GMAIL_OAUTH_EXPIRY_DATE: "op://BYOD/BYOD_LICENSE/GMAIL_OAUTH_EXPIRY_DATE"
    command: ["npm", "start"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));\""
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    read_only: true
    tmpfs:
      - /tmp:uid=1001,gid=1001,mode=1777
      - /app/.next/cache:uid=1001,gid=1001,mode=0755
    volumes:
      - ${MONGO_CA_CERT_PATH:-/etc/ssl/mongo/mongo-ca.crt}:/etc/ssl/mongo/mongo-ca.crt:ro
    secrets:
      - source: op_service_account_token
        target: op_service_account_token
    security_opt:
      - no-new-privileges:true
    cap_add:
      - SETUID
      - SETGID
    cap_drop:
      - ALL

secrets:
  op_service_account_token:
    file: /etc/opt/byod/op_service_account_token
